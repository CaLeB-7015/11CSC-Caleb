<!DOCTYPE html>
<html lang="en">
<head>

    <title>Contact</title>

    <link rel="icon" type="image/jpg" href="images/UW.jpg">

<style>

body{
    margin:0;
    font-family:"Lucida Console","Courier New",monospace;
background-image:url("images/WWW.jpg");
background-size:cover;
background-repeat:no-repeat;
color:white;
}

/* Navigation */

ul{
list-style-type:none;
    margin:0;
    padding:0;
    overflow:hidden;
    background-color:#043259;
}

li{
    float:left;
}

li a{
    display:block;
    color:white;
    text-align:center;
    padding:16px 18px;
text-decoration:none;
}

li a:hover{
    background:black;
}

/* Headings */

h1{
    color:burlywood;
text-align:center;
margin-top:40px;
}

h2{
    color:#ddb887;
    text-align:center;
    text-shadow:1px 1px 7px black;
}

p{
    width:70%;
margin:auto;
text-align:center;
font-size:18px;
line-height:1.6;
}

/* Contact Form */

.container{
    width:60%;
    margin:40px auto;
    background:#446591;
    padding:25px;
border-radius:12px;
}

label{
    display:block;
    margin-top:15px;
}

input[type=text],
select,
textarea{
width:100%;
    padding:12px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

textarea{
    resize:vertical;
}

input[type=submit]{
margin-top:20px;
background:#043259;
    color:white;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

input[type=submit]:hover{
    background:#021e36;
}

/* Footer */

 .footer {
   position: fixed;
   left: 0;
   bottom: 0;
   width: 100%;
   background-color: #043259;
   color: #ddb887;
   text-align: center;
}

</style>

</head>

<body>

<ul>
 <li><a href="index.html">Home</a></li>
 <li><a href="index2.html">About</a></li>
 <li><a href="index3.html">Solution</a></li>
 <li><a href="index4.html">Contact</a></li>
</ul>

<h1>Sea Level Rise</h1>

<h2>Contact Us</h2>

<p>
Have questions or feedback about sea level rise?
Use the contact form below to send us a message.
We would love to hear your ideas about protecting our environment and reducing the effects of sea level rise.
</p>

<div class="container">

<form action="thankyou.html">

<label for="fname">First Name</label>
<input type="text" id="fname" name="firstname" placeholder="Your name..." required>

<label for="lname">Last Name</label>
<input type="text" id="lname" name="lastname" placeholder="Your last name..." required>

<label for="country">Country</label>
<select id="country">
    <option>New Zealand</option>
    <option>Australia</option>
    <option>Canada</option>
    <option>USA</option>
</select>

<label for="subject">Message</label>
<textarea id="subject" rows="6" placeholder="Write something..."></textarea>

<input type="submit" value="Submit">

</form>

</div>

<div class="footer">
  <p>Footer</p>
</div>

</body>
</html>
